name = "verthash-ocm-monitor"
main = "src/index.js"
compatibility_date = "2025-01-01"

# No public HTTP endpoint, the worker only runs on its cron triggers
workers_dev = false

[triggers]
crons = [
  "* * * * *",   # OCM backends every minute, alerts after 5 failed checks in a row
  "0 12 * * *", # Blockbook and CoinPaprika once a day, alerts after 2 failed days in a row.
                # On Mondays this run also checks the backends and sends the weekly summary.
]

# Create with: npx wrangler@4.152.0 kv namespace create <any name>
# then paste the id below. Without it the worker alerts on every run while
# something is down, instead of only when the state changes.
# The binding name has to stay STATE, the code reads env.STATE.
[[kv_namespaces]]
binding = "STATE"
id = "517540d3553e4b62a1361324b81604bc"

[vars]
# Keep these in sync with networks/networks.go (a Go test checks that they are)
BLOCKBOOK_URLS = "https://blockbook.doge.zelcore.io/,https://dogecoin.atomicwallet.io/"
BACKEND_URLS = "https://ocmbackend.javerity.com/,https://ocmbackend.mindcraftblocks.com/"
# The Dogecoin Foundation address from https://foundation.dogecoin.com/about/. It is a
# long-lived, rarely moving address that always has UTXOs, which exercises the
# lookup without ever pointing at anyone's personal wallet.
PROBE_ADDRESS = "D89DhnsgKncmN12RejxudfU8AwXp3946q1"

# How many checks in a row have to fail before an OCM backend alerts. At one check a minute
# that is 5 minutes. A single success starts the count over.
FAILURES_BEFORE_ALERT = "5"

# The same for Blockbook and CoinPaprika, which are only checked once a day, so 2 is 48 hours
DAILY_FAILURES_BEFORE_ALERT = "2"

# Who to ping when a service is down, by Discord user id (Discord settings > Advanced >
# Developer Mode, then right-click a user > Copy User ID). The keys are "blockbook"
# (down when every server fails), "coinpaprika", and the host of each OCM backend.
# A service with no entry still alerts, it just doesn't ping anyone.
MENTIONS = '{"blockbook":"368416065644003339","coinpaprika":"368416065644003339","ocmbackend.javerity.com":"386004847113273366","ocmbackend.mindcraftblocks.com":"379781811108315136"}'

# Secret, set with: npx wrangler@4.152.0 secret put DISCORD_WEBHOOK_URL
